<script>
'use strict';

/* =========================================
   TELEGRAM
========================================= */

const tg = window.Telegram?.WebApp || null;

try {
  tg?.ready();
  tg?.expand?.();
  tg?.setHeaderColor?.('#07040d');
  tg?.setBackgroundColor?.('#07040d');
} catch(e) {
  console.error(e);
}

const user = tg?.initDataUnsafe?.user || {};

const telegramUserId = user.id || null;


/* =========================================
   CONFIG
========================================= */

const CONFIG = {
  START_BALANCE: 0,

  DEFAULT_BET: 100,
  MIN_BET: 100,
  MAX_BET: 10000,

  ONLINE_MIN: 850,
  ONLINE_MAX: 1450,

  BALANCE_UPDATE_INTERVAL: 2500
};


/* =========================================
   STORAGE
========================================= */

const STORAGE =
  'limbo_casino_v9_' +
  (telegramUserId || 'local');


const DEFAULT = {
  balance: 0,
  rounds: 0,
  net: 0,
  history: [],
  userCard: ''
};


let state = loadState();


function loadState(){

  try {

    const raw =
      localStorage.getItem(STORAGE);

    const saved =
      raw
        ? JSON.parse(raw)
        : null;

    return {
      ...DEFAULT,
      ...(saved || {}),
      history:
        Array.isArray(saved?.history)
          ? saved.history
          : []
    };

  } catch(e) {

    console.error(
      'Ошибка загрузки localStorage:',
      e
    );

    return {
      ...DEFAULT
    };

  }

}


function saveState(){

  try {

    localStorage.setItem(
      STORAGE,
      JSON.stringify(state)
    );

  } catch(e) {

    console.error(
      'Ошибка сохранения:',
      e
    );

  }

  render();

}


/* =========================================
   HELPERS
========================================= */

function $(selector){
  return document.querySelector(selector);
}


function fmt(value){

  return new Intl.NumberFormat(
    'ru-RU'
  ).format(
    Math.round(
      Number(value) || 0
    )
  );

}


function money(value){

  const n =
    Number(value) || 0;

  return (
    `${n >= 0 ? '+' : ''}${fmt(n)} ₽`
  );

}


function esc(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[m])
    );

}


function now(){

  return new Date().toLocaleString(
    'ru-RU',
    {
      day:'2-digit',
      month:'2-digit',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


/* =========================================
   TOAST
========================================= */

function toast(message){

  const element =
    $('#toast');

  if(!element){
    return;
  }

  element.textContent =
    message;

  element.classList.add('show');

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () => {
        element.classList.remove(
          'show'
        );
      },
      2500
    );

}


/* =========================================
   MODAL
========================================= */

function openModal(html){

  $('#modalContent').innerHTML =
    html;

  $('#modal').classList.add(
    'open'
  );

  document.body.style.overflow =
    'hidden';

}


function closeModal(){

  $('#modal').classList.remove(
    'open'
  );

  document.body.style.overflow =
    '';

}


$('#close').onclick =
  closeModal;


$('#modal').onclick =
  e => {

    if(
      e.target.id === 'modal'
    ){

      closeModal();

    }

  };


/* =========================================
   TELEGRAM INIT DATA
========================================= */

/*
  ВАЖНО:

  Не отправляем BOT_TOKEN в браузер.

  Telegram передаёт Mini App специальную
  строку initData.

  Её сервер должен проверять через
  Telegram Bot API / алгоритм проверки
  init data.

  На сервер отправляем именно initData.
*/

function getTelegramInitData(){

  if(!tg){
    return '';
  }

  return tg.initData || '';
}


/* =========================================
   SERVER REQUEST
========================================= */

async function apiRequest(
  url,
  options = {}
){

  const headers = {
    'Content-Type':'application/json',
    ...(options.headers || {})
  };


  const initData =
    getTelegramInitData();


  if(initData){

    headers[
      'X-Telegram-Init-Data'
    ] = initData;

  }


  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );


  let data = null;


  try {

    data =
      await response.json();

  } catch {

    data = null;

  }


  if(!response.ok){

    const message =
      data?.error ||
      data?.message ||
      `Ошибка сервера: ${response.status}`;

    throw new Error(message);

  }


  return data;

}


/* =========================================
   BALANCE FROM SERVER
========================================= */

let balanceSyncBusy = false;


async function syncBalanceFromServer(){

  if(!telegramUserId){
    return;
  }


  if(balanceSyncBusy){
    return;
  }


  balanceSyncBusy = true;


  try {

    const data =
      await apiRequest(
        '/api/balance',
        {
          method:'GET'
        }
      );


    if(
      data &&
      typeof data.balance !== 'undefined'
    ){

      const serverBalance =
        Number(data.balance);


      if(
        Number.isFinite(
          serverBalance
        )
      ){

        state.balance =
          serverBalance;

        saveState();

      }

    }

  } catch(error){

    console.error(
      'Ошибка синхронизации баланса:',
      error
    );

  } finally {

    balanceSyncBusy =
      false;

  }

}


/*
  Обновляем баланс регулярно.
*/

setInterval(
  syncBalanceFromServer,
  CONFIG.BALANCE_UPDATE_INTERVAL
);


/* =========================================
   USER
========================================= */

function updateUser(){

  $('#profileId').textContent =
    user.id || '—';


  $('#profileUsername').textContent =
    user.username
      ? '@' + user.username
      : '—';


  $('#profileName').textContent =
    [
      user.first_name,
      user.last_name
    ]
      .filter(Boolean)
      .join(' ') ||
      'Player';


  $('#profileBalance').textContent =
    fmt(state.balance);

}


/* =========================================
   RENDER
========================================= */

function render(){

  $('#balance').textContent =
    fmt(state.balance);


  $('#rounds').textContent =
    state.rounds;


  $('#profileRounds').textContent =
    state.rounds;


  $('#profit').textContent =
    money(state.net);


  $('#sessionNet').textContent =
    money(state.net);


  updateUser();


  const history =
    $('#historyList');


  if(!history){
    return;
  }


  history.innerHTML =
    state.history.length

      ? state.history
          .map(
            item =>
              `
              <div class="history-item">

                <div>

                  <b>
                    ${esc(item.game)}
                  </b>

                  <div
                    class="muted"
                    style="
                      font-size:9px;
                      margin-top:3px
                    "
                  >
                    ${esc(item.time)}
                    ·
                    ${esc(item.label)}
                  </div>

                </div>

                <b
                  class="${
                    item.delta >= 0
                      ? 'win'
                      : 'loss'
                  }"
                >
                  ${money(item.delta)}
                </b>

              </div>
              `
          )
          .join('')

      : `
        <div class="empty">
          📭 Пока нет действий
        </div>
      `;

}


/* =========================================
   GAME HISTORY
========================================= */

function recordGame(
  game,
  delta,
  label
){

  state.rounds++;

  state.net += delta;

  state.history.unshift({

    type:'game',

    game,

    delta,

    label,

    time:now()

  });


  state.history =
    state.history.slice(
      0,
      50
    );


  saveState();

}


/* =========================================
   BET
========================================= */

function spendBet(bet){

  bet =
    Number(bet);


  if(!Number.isFinite(bet)){
    return false;
  }


  if(
    state.balance <
    bet
  ){

    toast(
      'Недостаточно средств'
    );

    return false;

  }


  state.balance -= bet;

  return true;

}


function winPayout(amount){

  amount =
    Number(amount);


  if(
    !Number.isFinite(amount)
  ){
    return;
  }


  state.balance +=
    amount;

}


/* =========================================
   CONFETTI
========================================= */

function celebrate(){

  const box =
    $('#confetti');

  if(!box){
    return;
  }


  box.innerHTML = '';


  for(
    let i = 0;
    i < 42;
    i++
  ){

    const element =
      document.createElement('i');


    element.style.left =
      Math.random() * 100 + '%';


    element.style.setProperty(
      '--x',
      (
        Math.random() * 240 -
        120
      ) + 'px'
    );


    element.style.animationDelay =
      Math.random() * .35 + 's';


    element.style.background =
      [
        '#ff3f9f',
        '#7c5cff',
        '#45e9ff',
        '#ffd76a',
        '#5df0a2'
      ][
        Math.floor(
          Math.random() * 5
        )
      ];


    box.appendChild(
      element
    );

  }


  setTimeout(
    () => {
      box.innerHTML = '';
    },
    2200
  );

}


/* =========================================
   NAVIGATION
========================================= */

document
  .querySelectorAll('.nav button')
  .forEach(
    button => {

      button.onclick =
        () => {

          document
            .querySelectorAll(
              '.nav button'
            )
            .forEach(
              item =>
                item.classList.remove(
                  'active'
                )
            );


          button.classList.add(
            'active'
          );


          document
            .querySelectorAll(
              '.section'
            )
            .forEach(
              section =>
                section.classList.remove(
                  'active'
                )
            );


          const target =
            $(
              '#' +
              button.dataset.tab +
              'Section'
            );


          if(target){

            target.classList.add(
              'active'
            );

          }

        };

    }
  );


/* =========================================
   ONLINE
========================================= */

let online = 1024;


function tickOnline(){

  online =
    Math.max(
      CONFIG.ONLINE_MIN,
      Math.min(
        CONFIG.ONLINE_MAX,
        online +
        Math.floor(
          Math.random() * 31
        ) -
        15
      )
    );


  $('#onlineCount').textContent =
    fmt(online);

}


setInterval(
  tickOnline,
  2500
);


tickOnline();


/* =========================================
   PAYMENT CARD
========================================= */

function paymentCard(
  title,
  detail,
  warning = ''
){

  return `
    <div class="requisites">

      <div class="req-title">
        ${esc(title)}
      </div>

      <div class="req-number">
        ${esc(detail)}
      </div>

      ${
        warning
          ? `
            <div
              class="muted"
              style="
                font-size:10px;
                margin-top:6px
              "
            >
              ${esc(warning)}
            </div>
          `
          : ''
      }

      <button
        class="btn secondary copy-btn"
        data-copy="${esc(detail)}"
      >
        📋 Скопировать реквизиты
      </button>

    </div>
  `;

}


/* =========================================
   DEPOSIT
========================================= */

function openDeposit(){

  let method =
    'bank';


  let step =
    state.userCard
      ? 2
      : 1;


  function renderPayment(){

    /* ===============================
       STEP 1
    =============================== */

    if(step === 1){

      openModal(`

        <div class="modal-title">
          💎 Пополнение
        </div>

        <div class="modal-sub">
          Привяжите карту для удобного
          пополнения
        </div>

        <div
          class="label"
          style="margin-top:13px"
        >
          Укажите номер вашей карты
        </div>

        <input
          class="input"
          id="userCardInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="0000 0000 0000 0000"
          value="${esc(
            state.userCard
          )}"
        >

        <button
          class="btn primary"
          style="
            width:100%;
            margin-top:12px
          "
          id="saveCardBtn"
        >
          Продолжить ➔
        </button>

      `);


      $('#saveCardBtn').onclick =
        () => {

          const value =
            $('#userCardInput')
              .value
              .trim();


          const digits =
            value.replace(
              /\D/g,
              ''
            );


          if(
            digits.length < 16
          ){

            toast(
              'Введите корректный номер карты!'
            );

            return;

          }


          state.userCard =
            value;


          saveState();


          step = 2;


          renderPayment();

        };


      return;

    }


    /* ===============================
       STEP 2
    =============================== */

    openModal(`

      <div class="modal-title">
        💎 Пополнение
      </div>

      <div class="choice">

        <button
          class="btn ${
            method === 'bank'
              ? 'primary'
              : 'secondary'
          }"
          id="payBank"
        >
          💳 Карта
        </button>

        <button
          class="btn ${
            method === 'crypto'
              ? 'primary'
              : 'secondary'
          }"
          id="payCrypto"
        >
          ₮ USDT
        </button>

      </div>

      <div
        class="label"
        style="margin-top:13px"
      >
        Сумма пополнения (₽)
      </div>

      <input
        class="input"
        id="payAmountInput"
        type="number"
        min="100"
        step="100"
        placeholder="1000"
        value="1000"
      >

      ${
        method === 'bank'
          ? paymentCard(
              'РЕКВИЗИТЫ ДЛЯ ПЕРЕВОДА',
              '2200396113165076',
              'Переведите точную сумму на карту выше.'
            )
          : paymentCard(
              'USDT · TRC20',
              'TTPjHC9vAyGX9FLjQ8F9BjCvTCwr2Q1ZLT',
              '⚠️ Сеть: TRON (TRC20).'
            )
      }

      <div
        class="label"
        style="margin-top:10px"
      >
        После оплаты нажмите кнопку ниже
      </div>

      <div
        class="muted"
        style="
          font-size:10px;
          line-height:1.5;
          margin-top:6px;
        "
      >
        После нажатия заявки информация
        будет отправлена на сервер.
        После проверки платежа баланс
        обновится автоматически.
      </div>

      <button
        class="btn primary"
        style="
          width:100%;
          margin-top:12px
        "
        id="submitDepositBtn"
      >
        ✅ Я оплатил
      </button>

    `);


    /* ===============================
       PAYMENT METHOD
    =============================== */

    $('#payBank').onclick =
      () => {

        method =
          'bank';

        renderPayment();

      };


    $('#payCrypto').onclick =
      () => {

        method =
          'crypto';

        renderPayment();

      };


    /* ===============================
       COPY
    =============================== */

    document
      .querySelectorAll(
        '[data-copy]'
      )
      .forEach(
        button => {

          button.onclick =
            async () => {

              try {

                await navigator
                  .clipboard
                  .writeText(
                    button.dataset.copy
                  );


                toast(
                  'Скопировано'
                );

              } catch(error) {

                console.error(
                  error
                );

                toast(
                  'Не удалось скопировать'
                );

              }

            };

        }
      );


    /* ===============================
       SUBMIT DEPOSIT
    =============================== */

    $('#submitDepositBtn').onclick =
      async () => {

        const button =
          $('#submitDepositBtn');


        const amount =
          Number(
            $('#payAmountInput')
              .value
          );


        if(
          !Number.isFinite(amount) ||
          amount < 100
        ){

          toast(
            'Минимальная сумма — 100 ₽'
          );

          return;

        }


        if(
          amount >
          1000000
        ){

          toast(
            'Слишком большая сумма'
          );

          return;

        }


        if(!tg){

          toast(
            'Откройте казино через Telegram'
          );

          return;

        }


        if(!telegramUserId){

          toast(
            'Не удалось определить Telegram ID'
          );

          return;

        }


        /*
          Больше НЕ используем:

          tg.sendData()

          и НЕ используем:

          bot token

          в браузере.

          Заявка идёт на backend.
        */


        button.disabled =
          true;

        button.textContent =
          '⏳ Отправка...';


        try {

          const result =
            await apiRequest(
              '/api/deposit',
              {
                method:'POST',

                body:JSON.stringify({

                  amount,

                  method,

                  user_id:
                    telegramUserId

                })
              }
            );


          if(
            result?.success === false
          ){

            throw new Error(
              result.error ||
              'Не удалось создать заявку'
            );

          }


          toast(
            '✅ Заявка создана'
          );


          /*
            Закрываем окно через небольшую
            задержку, чтобы пользователь
            увидел сообщение.
          */

          setTimeout(
            () => {

              closeModal();

            },
            700
          );


          /*
            Через секунду пробуем получить
            актуальный баланс.
          */

          setTimeout(
            syncBalanceFromServer,
            1000
          );


        } catch(error) {

          console.error(
            'Deposit error:',
            error
          );


          toast(
            '❌ ' +
            (
              error.message ||
              'Ошибка отправки заявки'
            )
          );


          button.disabled =
            false;

          button.textContent =
            '✅ Я оплатил';

        }

      };

  }


  renderPayment();

}


/* =========================================
   WITHDRAW
========================================= */

function openWithdraw(){

  if(!state.userCard){

    toast(
      'Сначала привяжите карту в разделе пополнения!'
    );

    return;

  }


  if(
    state.balance <= 0
  ){

    toast(
      'Недостаточно средств для вывода'
    );

    return;

  }


  openModal(`

    <div class="modal-title">
      💳 Вывод
    </div>

    <div class="panel">

      <div class="row">

        <span>
          Доступно к выводу
        </span>

        <b>
          ${fmt(state.balance)} ₽
        </b>

      </div>

    </div>

    <div
      class="label"
      style="margin-top:10px"
    >
      Карта для вывода
    </div>

    <input
      class="input"
      type="text"
      value="${esc(
        state.userCard
      )}"
      disabled
    >

    <div
      class="label"
      style="margin-top:10px"
    >
      Сумма вывода (₽)
    </div>

    <input
      class="input"
      id="withdrawAmt"
      type="number"
      min="100"
      max="${state.balance}"
      placeholder="500"
    >

    <button
      class="btn primary"
      style="
        width:100%;
        margin-top:12px
      "
      id="submitWBtn"
    >
      Создать заявку на вывод
    </button>

  `);


  $('#submitWBtn').onclick =
    async () => {

      const button =
        $('#submitWBtn');


      const amount =
        Number(
          $('#withdrawAmt').value
        );


      if(
        !Number.isFinite(amount) ||
        amount < 100
      ){

        toast(
          'Минимальная сумма вывода — 100 ₽'
        );

        return;

      }


      if(
        amount >
        state.balance
      ){

        toast(
          'Недостаточно средств'
        );

        return;

      }


      button.disabled =
        true;

      button.textContent =
        '⏳ Отправка...';


      try {

        const result =
          await apiRequest(
            '/api/withdraw',
            {
              method:'POST',

              body:JSON.stringify({

                amount,

                card:
                  state.userCard,

                user_id:
                  telegramUserId

              })
            }
          );


        if(
          result?.success === false
        ){

          throw new Error(
            result.error ||
            'Не удалось создать заявку'
          );

        }


        toast(
          '✅ Заявка на вывод создана'
        );


        closeModal();


        setTimeout(
          syncBalanceFromServer,
          500
        );


      } catch(error) {

        console.error(
          'Withdraw error:',
          error
        );


        toast(
          '❌ ' +
          (
            error.message ||
            'Ошибка создания заявки'
          )
        );


        button.disabled =
          false;

        button.textContent =
          'Создать заявку на вывод';

      }

    };

}


/* =========================================
   BUTTONS
========================================= */

$('#depositBtn').onclick =
  openDeposit;


$('#withdrawBtn').onclick =
  openWithdraw;


$('#btnGameMines').onclick =
  openMines;


$('#btnGameSlots').onclick =
  openSlots;


$('#btnGameCoin').onclick =
  openCoin;


$('#btnGameDice').onclick =
  openDice;


/* =========================================
   MINES
========================================= */

function openMines(){

  let mineCount = 3;

  let bet =
    CONFIG.DEFAULT_BET;

  let opened = 0;

  let over = false;

  let mult = 1;

  let mineIndexes = [];


  function newMines(){

    mineIndexes = [];


    while(
      mineIndexes.length <
      mineCount
    ){

      const index =
        Math.floor(
          Math.random() * 25
        );


      if(
        !mineIndexes.includes(
          index
        )
      ){

        mineIndexes.push(
          index
        );

      }

    }

  }


  function draw(){

    const grid =
      $('#mineGrid');


    if(!grid){
      return;
    }


    grid.innerHTML =
      Array.from(
        {
          length:25
        },
        (_,i) =>
          `
          <button
            class="mine-cell"
            data-mine="${i}"
          >
            ?
          </button>
          `
      ).join('');


    grid
      .querySelectorAll(
        '[data-mine]'
      )
      .forEach(
        cell => {

          cell.onclick =
            () =>
              clickCell(cell);

        }
      );

  }


  function reset(){

    opened = 0;

    over = false;

    mult = 1;


    $('#cashoutMine').disabled =
      true;


    $('#mineStatus').textContent =
      'Открыто: 0 · x1.00';


    draw();

  }


  function start(){

    if(!spendBet(bet)){
      return;
    }


    newMines();

    reset();


    $('#startMine').disabled =
      true;


    $('#mineStatus').textContent =
      `Игра начата · ${mineCount} мин`;


    saveState();

  }


  function clickCell(cell){

    if(over){
      return;
    }


    const index =
      Number(
        cell.dataset.mine
      );


    if(
      mineIndexes.includes(
        index
      )
    ){

      cell.textContent =
        '💣';


      cell.classList.add(
        'mine'
      );


      document
        .querySelectorAll(
          '[data-mine]'
        )
        .forEach(
          element => {

            if(
              mineIndexes.includes(
                Number(
                  element.dataset.mine
                )
              )
            ){

              element.textContent =
                '💣';

            }

            element.disabled =
              true;

          }
        );


      over = true;


      recordGame(
        'MINES',
        -bet,
        'Мина · ставка списана'
      );


      $('#mineStatus').textContent =
        '💥 Мина!';


      $('#startMine').disabled =
        false;


      return;

    }


    cell.textContent =
      '💎';


    cell.classList.add(
      'safe'
    );


    cell.disabled =
      true;


    opened++;


    mult =
      1 +
      (
        opened *
        (
          0.14 +
          mineCount *
          0.012
        )
      );


    const payout =
      Math.floor(
        bet * mult
      );


    $('#mineStatus').textContent =
      `Открыто: ${opened} · x${mult.toFixed(2)} · ${payout} ₽`;


    $('#cashoutMine').disabled =
      false;

  }


  function cashout(){

    if(
      over ||
      !opened
    ){

      return;

    }


    const payout =
      Math.floor(
        bet * mult
      );


    over = true;


    document
      .querySelectorAll(
        '[data-mine]'
      )
      .forEach(
        cell =>
          cell.disabled = true
      );


    winPayout(
      payout
    );


    recordGame(
      'MINES',
      payout,
      `Выигрыш ${payout} ₽`
    );


    celebrate();


    toast(
      `🎉 +${fmt(payout)} ₽`
    );


    $('#mineStatus').textContent =
      `🎉 Забрано ${fmt(payout)} ₽`;


    $('#cashoutMine').disabled =
      true;


    $('#startMine').disabled =
      false;


    saveState();

  }


  openModal(`

    <div class="modal-title">
      💣 MINES
    </div>

    <div class="modal-sub">
      Выбор мин: <b>1–23</b> · поле 5×5
    </div>

    <div class="mine-settings">

      <button id="mineDec">
        −
      </button>

      <span id="mineCountDisplay">
        ${mineCount}
      </span>

      <button id="mineInc">
        +
      </button>

    </div>

    <div class="betbox">

      <span>
        Ставка
      </span>

      <b id="mineBet">
        ${fmt(bet)} ₽
      </b>

      <div class="betcontrols">

        <button id="betMinus">
          −100
        </button>

        <button id="betPlus">
          +100
        </button>

      </div>

    </div>

    <div
      class="mine-grid"
      id="mineGrid"
    ></div>

    <div
      class="panel"
      style="text-align:center"
    >
      <b id="mineStatus">
        Готово · x1.00
      </b>
    </div>

    <div class="choice">

      <button
        class="btn primary"
        id="startMine"
      >
        🚀 Начать
      </button>

      <button
        class="btn success"
        id="cashoutMine"
        disabled
      >
        💰 Забрать
      </button>

    </div>

  `);


  newMines();

  draw();


  $('#mineDec').onclick =
    () => {

      if(
        over ||
        mineCount <= 1
      ){

        return;

      }


      mineCount--;


      $('#mineCountDisplay')
        .textContent =
        mineCount;


      newMines();

      draw();

    };


  $('#mineInc').onclick =
    () => {

      if(
        over ||
        mineCount >= 23
      ){

        return;

      }


      mineCount++;


      $('#mineCountDisplay')
        .textContent =
        mineCount;


      newMines();

      draw();

    };


  $('#betMinus').onclick =
    () => {

      bet =
        Math.max(
          CONFIG.MIN_BET,
          bet - 100
        );


      $('#mineBet')
        .textContent =
        fmt(bet) + ' ₽';

    };


  $('#betPlus').onclick =
    () => {

      bet =
        Math.min(
          CONFIG.MAX_BET,
          bet + 100
        );


      $('#mineBet')
        .textContent =
        fmt(bet) + ' ₽';

    };


  $('#startMine').onclick =
    start;


  $('#cashoutMine').onclick =
    cashout;

}


/* =========================================
   SLOTS
========================================= */

function openSlots(){

  const symbols = [
    '🍒',
    '🍋',
    '🍉',
    '⭐',
    '7️⃣',
    '💎'
  ];


  let bet = 100;

  let busy = false;


  openModal(`

    <div class="modal-title">
      🎰 SLOTS
    </div>

    <div class="modal-sub">
      Три барабана · ставка
      <b id="slotBet">
        ${bet} ₽
      </b>
    </div>

    <div class="reels">

      <div
        class="reel"
        id="reel1"
      >
        🍒
      </div>

      <div
        class="reel"
        id="reel2"
      >
        🍋
      </div>

      <div
        class="reel"
        id="reel3"
      >
        ⭐
      </div>

    </div>

    <div
      id="slotStatus"
      class="muted"
      style="
        text-align:center;
        padding:12px
      "
    >
      Готов к спину
    </div>

    <div
      class="betcontrols"
      style="
        justify-content:center;
        margin-bottom:9px
      "
    >

      <button id="slotMinus">
        −100
      </button>

      <button id="slotPlus">
        +100
      </button>

    </div>

    <button
      class="btn primary"
      style="width:100%"
      id="spinSlots"
    >
      🎰 SPIN
    </button>

  `);


  $('#slotMinus').onclick =
    () => {

      bet =
        Math.max(
          100,
          bet - 100
        );


      $('#slotBet').textContent =
        fmt(bet) + ' ₽';

    };


  $('#slotPlus').onclick =
    () => {

      bet =
        Math.min(
          CONFIG.MAX_BET,
          bet + 100
        );


      $('#slotBet').textContent =
        fmt(bet) + ' ₽';

    };


  $('#spinSlots').onclick =
    () => {

      if(
        busy ||
        !spendBet(bet)
      ){

        return;

      }


      busy = true;

      saveState();


      const r1 =
        $('#reel1');

      const r2 =
        $('#reel2');

      const r3 =
        $('#reel3');


      [r1,r2,r3]
        .forEach(
          reel =>
            reel.className =
              'reel spin'
        );


      setTimeout(
        () => {

          const s1 =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          const s2 =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          const s3 =
            symbols[
              Math.floor(
                Math.random() *
                symbols.length
              )
            ];


          r1.className =
            'reel';

          r2.className =
            'reel';

          r3.className =
            'reel';


          r1.textContent =
            s1;

          r2.textContent =
            s2;

          r3.textContent =
            s3;


          busy = false;


          if(
            s1 === s2 &&
            s2 === s3
          ){

            const payout =
              bet * 5;


            winPayout(
              payout
            );


            celebrate();


            [r1,r2,r3]
              .forEach(
                reel =>
                  reel.classList.add(
                    'win'
                  )
              );


            recordGame(
              'SLOTS',
              payout,
              'ДЖЕКПОТ x5'
            );


            $('#slotStatus').textContent =
              `🎉 ДЖЕКПОТ! +${fmt(payout)} ₽`;

          }

          else if(
            s1 === s2 ||
            s2 === s3 ||
            s1 === s3
          ){

            const payout =
              Math.floor(
                bet * 1.5
              );


            winPayout(
              payout
            );


            recordGame(
              'SLOTS',
              payout,
              'Пара x1.5'
            );


            $('#slotStatus').textContent =
              `✨ Выигрыш! +${fmt(payout)} ₽`;

          }

          else{

            recordGame(
              'SLOTS',
              -bet,
              'Проигрыш'
            );


            $('#slotStatus').textContent =
              '❌ Не повезло';

          }


          saveState();

        },
        800
      );

    };

}


/* =========================================
   COINFLIP
========================================= */

function openCoin(){

  let bet = 100;

  let choice =
    'heads';

  let busy = false;


  openModal(`

    <div class="modal-title">
      🪙 COINFLIP
    </div>

    <div class="modal-sub">
      Орёл или Решка
    </div>

    <div
      class="coin"
      id="coinIcon"
    >
      🦅
    </div>

    <div
      class="choice"
      style="margin-bottom:10px"
    >

      <button
        class="btn primary"
        id="btnHeads"
      >
        🦅 Орёл
      </button>

      <button
        class="btn secondary"
        id="btnTails"
      >
        🪙 Решка
      </button>

    </div>

    <div class="betbox">

      <span>
        Ставка
      </span>

      <b id="coinBet">
        ${bet} ₽
      </b>

      <div class="betcontrols">

        <button id="coinMinus">
          −100
        </button>

        <button id="coinPlus">
          +100
        </button>

      </div>

    </div>

    <button
      class="btn primary"
      style="width:100%"
      id="flipCoin"
    >
      🪙 Бросить монету
    </button>

  `);


  $('#btnHeads').onclick =
    () => {

      choice =
        'heads';


      $('#btnHeads').className =
        'btn primary';


      $('#btnTails').className =
        'btn secondary';

    };


  $('#btnTails').onclick =
    () => {

      choice =
        'tails';


      $('#btnTails').className =
        'btn primary';


      $('#btnHeads').className =
        'btn secondary';

    };


  $('#coinMinus').onclick =
    () => {

      bet =
        Math.max(
          100,
          bet - 100
        );


      $('#coinBet').textContent =
        fmt(bet) + ' ₽';

    };


  $('#coinPlus').onclick =
    () => {

      bet =
        Math.min(
          CONFIG.MAX_BET,
          bet + 100
        );


      $('#coinBet').textContent =
        fmt(bet) + ' ₽';

    };


  $('#flipCoin').onclick =
    () => {

      if(
        busy ||
        !spendBet(bet)
      ){

        return;

      }


      busy = true;

      saveState();


      const coin =
        $('#coinIcon');


      coin.classList.add(
        'flip'
      );


      setTimeout(
        () => {

          coin.classList.remove(
            'flip'
          );


          const isHeads =
            Math.random() > .5;


          const result =
            isHeads
              ? 'heads'
              : 'tails';


          coin.textContent =
            isHeads
              ? '🦅'
              : '🪙';


          busy = false;


          if(
            result === choice
          ){

            const payout =
              bet * 2;


            winPayout(
              payout
            );


            celebrate();


            recordGame(
              'COINFLIP',
              payout,
              'Угадал x2'
            );


            toast(
              `🎉 Выигрыш! +${fmt(payout)} ₽`
            );

          }

          else{

            recordGame(
              'COINFLIP',
              -bet,
              'Проигрыш'
            );


            toast(
              '❌ Не угадал'
            );

          }


          saveState();

        },
        800
      );

    };

}


/* =========================================
   DICE
========================================= */

function openDice(){

  let bet = 100;

  let busy = false;


  openModal(`

    <div class="modal-title">
      🎲 DICE
    </div>

    <div class="modal-sub">
      Брось кость (1–6)
    </div>

    <div
      class="dice"
      id="diceIcon"
    >
      🎲
    </div>

    <div class="betbox">

      <span>
        Ставка
      </span>

      <b id="diceBet">
        ${bet} ₽
      </b>

      <div class="betcontrols">

        <button id="diceMinus">
          −100
        </button>

        <button id="dicePlus">
          +100
        </button>

      </div>

    </div>

    <button
      class="btn primary"
      style="width:100%"
      id="rollDice"
    >
      🎲 Бросить (4–6 = победа x2)
    </button>

  `);


  $('#diceMinus').onclick =
    () => {

      bet =
        Math.max(
          100,
          bet - 100
        );


      $('#diceBet').textContent =
        fmt(bet) + ' ₽';

    };


  $('#dicePlus').onclick =
    () => {

      bet =
        Math.min(
          CONFIG.MAX_BET,
          bet + 100
        );


      $('#diceBet').textContent =
        fmt(bet) + ' ₽';

    };


  $('#rollDice').onclick =
    () => {

      if(
        busy ||
        !spendBet(bet)
      ){

        return;

      }


      busy = true;

      saveState();


      const dice =
        $('#diceIcon');


      dice.classList.add(
        'roll'
      );


      setTimeout(
        () => {

          dice.classList.remove(
            'roll'
          );


          const value =
            Math.floor(
              Math.random() * 6
            ) + 1;


          const faces = [
            '1️⃣',
            '2️⃣',
            '3️⃣',
            '4️⃣',
            '5️⃣',
            '6️⃣'
          ];


          dice.textContent =
            faces[value - 1];


          busy = false;


          if(
            value >= 4
          ){

            const payout =
              bet * 2;


            winPayout(
              payout
            );


            celebrate();


            recordGame(
              'DICE',
              payout,
              `Выпало ${value} (Победа x2)`
            );


            toast(
              `🎉 Выпало ${value}! +${fmt(payout)} ₽`
            );

          }

          else{

            recordGame(
              'DICE',
              -bet,
              `Выпало ${value} (Проигрыш)`
            );


            toast(
              `❌ Выпало ${value}. Не повезло`
            );

          }


          saveState();

        },
        1000
      );

    };

}
