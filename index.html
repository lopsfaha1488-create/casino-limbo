<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CASINO LIMBO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
    .btn { background: var(--card-bg); color: var(--text); border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn.primary { background: var(--accent); border: none; }
    .btn.primary:hover { background: var(--accent-hover); }
    .input { width: 100%; background: #090d16; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; margin-top: 6px; font-size: 16px; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
    .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .modal-sub { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .choice { display: flex; gap: 8px; margin-bottom: 12px; }
    .choice .btn { flex: 1; }
    .pay-card { background: #090d16; padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
    .pay-card-title { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .pay-card-num { font-family: monospace; font-size: 16px; color: #4ade80; word-break: break-all; margin-bottom: 8px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #334155; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 200; }
    .toast.active { opacity: 1; }
  </style>
</head>
<body>

  <h2>🎰 CASINO LIMBO</h2>
  <button class="btn primary" id="depositBtn" style="margin-top: 20px;">💎 Пополнить баланс</button>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const state = {
      userCard: localStorage.getItem('userCard') || ''
    };

    function saveState() {
      localStorage.setItem('userCard', state.userCard);
    }

    const $ = selector => document.querySelector(selector);

    function toast(msg) {
      const t = $('#toast');
      t.innerText = msg;
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2500);
    }

    function esc(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

    function openModal(html) {
      $('#modalContent').innerHTML = html;
      $('#modalOverlay').classList.add('active');
    }

    function closeModal() {
      $('#modalOverlay').classList.remove('active');
    }

    // Закрытие по клику на фон
    $('#modalOverlay').onclick = (e) => {
      if (e.target === $('#modalOverlay')) closeModal();
    };

    function paymentCard(title, reqs, note) {
      return `
        <div class="pay-card">
          <div class="pay-card-title">${title}</div>
          <div class="pay-card-num">${reqs}</div>
          <div style="font-size: 12px; color: var(--muted);">${note}</div>
          <button class="btn" style="width:100%; margin-top:8px; padding:6px 12px; font-size:12px;" data-copy="${reqs}">📋 Скопировать</button>
        </div>
      `;
    }

    /* =====================================================
       ЛОГИКА ПОПОЛНЕНИЯ
    ===================================================== */
    function openDeposit(){
      let method = 'bank';
      let step = state.userCard ? 2 : 1;

      function renderPay(){
        if(step === 1){
          openModal(`
            <div class="modal-title">💎 Пополнение</div>
            <div class="modal-sub">Привяжите карту для удобного пополнения</div>
            <div class="label" style="margin-top:13px">Укажите номер вашей карты</div>
            <input class="input" id="userCardInput" type="text" inputmode="numeric" placeholder="0000 0000 0000 0000" value="${esc(state.userCard)}">
            <button class="btn primary" style="width:100%;margin-top:12px" id="saveCardBtn">Продолжить ➔</button>
          `);

          $('#saveCardBtn').onclick = () => {
            const cardVal = $('#userCardInput').value.trim();
            const digits = cardVal.replace(/\D/g, '');
            if(digits.length < 16){
              toast('Введите корректный номер карты');
              return;
            }
            state.userCard = cardVal;
            saveState();
            step = 2;
            renderPay();
          };
          return;
        }

        openModal(`
          <div class="modal-title">💎 Пополнение</div>
          <div class="choice">
            <button class="btn ${method === 'bank' ? 'primary' : ''}" id="payBank">💳 Карта</button>
            <button class="btn ${method === 'crypto' ? 'primary' : ''}" id="payCrypto">₮ USDT</button>
          </div>
          <div class="label" style="margin-top:13px; font-size:14px;">Сумма пополнения (₽)</div>
          <input class="input" id="payAmountInput" type="number" min="100" max="1000000" step="100" placeholder="1000" value="1000">

          ${method === 'bank' 
            ? paymentCard('РЕКВИЗИТЫ ДЛЯ ПЕРЕВОДА', '2200396113165076', 'Переведите точную сумму на карту выше.') 
            : paymentCard('USDT · TRC20', 'TTPjHC9vAyGX9FLjQ8F9BjCvTCwr2Q1ZLT', '⚠️ Сеть: TRON (TRC20).')}

          <div style="font-size:11px; color: var(--muted); margin-top:10px;">
            После перевода нажмите кнопку ниже и отправьте боту чек.
          </div>
          <button class="btn primary" style="width:100%;margin-top:12px" id="submitDepositBtn">✅ Я оплатил</button>
        `);

        $('#payBank').onclick = () => { method = 'bank'; renderPay(); };
        $('#payCrypto').onclick = () => { method = 'crypto'; renderPay(); };

        // Скопировать реквизиты
        document.querySelectorAll('[data-copy]').forEach(b => {
          b.onclick = () => {
            navigator.clipboard.writeText(b.dataset.copy);
            toast('Скопировано в буфер обмена');
          };
        });

        // Отправка данных в Бот
        $('#submitDepositBtn').onclick = () => {
          const amount = parseFloat($('#payAmountInput').value) || 0;
          if (amount < 100) {
            toast('Минимальная сумма — 100 ₽');
            return;
          }

          if (tg && tg.sendData) {
            tg.sendData(JSON.stringify({
              action: 'deposit',
              amount: amount,
              method: method,
              card: state.userCard
            }));
            closeModal();
          } else {
            toast('Откройте приложение внутри Telegram');
          }
        };
      }

      renderPay();
    }

    $('#depositBtn').onclick = openDeposit;
  </script>
</body>
</html>
