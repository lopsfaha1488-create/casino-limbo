<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CASINO LIMBO</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0c20;
            --card-bg: #1a1636;
            --accent: #9d4edd;
            --accent-glow: #7b2cbf;
            --text: #ffffff;
            --text-dim: #a0a0c0;
            --green: #00f5d4;
            --red: #ff0054;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(157, 78, 221, 0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            font-weight: bold;
            color: var(--green);
        }

        /* CONTAINER */
        .container {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .game-card h3 {
            margin-top: 10px;
            font-size: 16px;
        }

        .game-icon {
            font-size: 40px;
        }

        /* MODAL GAME WINDOW */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 100;
            flex-direction: column;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: var(--red);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .game-area {
            flex: 1;
            background: var(--card-bg);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            border: 1px solid var(--accent);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(45deg, var(--accent), var(--accent-glow));
            border: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* MINES GRID */
        .mines-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 300px;
        }

        .mine-tile {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .mine-tile.open {
            background: rgba(0, 245, 212, 0.2);
            border: 1px solid var(--green);
        }

        .mine-tile.bomb {
            background: rgba(255, 0, 84, 0.3);
            border: 1px solid var(--red);
        }

        /* SLOTS */
        .slots-display {
            display: flex;
            gap: 15px;
            font-size: 50px;
            background: rgba(0,0,0,0.5);
            padding: 20px 40px;
            border-radius: 15px;
            border: 2px solid var(--accent);
        }

        /* COINFLIP */
        .coin {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: gold;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 0 20px gold;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="user-info">
            <div class="avatar" id="user-avatar">U</div>
            <div>
                <div id="user-name" style="font-weight: bold;">Игрок</div>
                <div style="font-size: 12px; color: var(--text-dim);" id="user-id">ID: -------</div>
            </div>
        </div>
        <div class="balance-box">
            <span id="balance">0</span> ₽
        </div>
    </header>

    <!-- MAIN MENU -->
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 10px;">🎰 ВЫБЕРИТЕ ИГРУ</h2>
        
        <div class="games-grid">
            <div class="game-card" onclick="openGame('mines')">
                <div class="game-icon">💣</div>
                <h3>Mines</h3>
            </div>
            <div class="game-card" onclick="openGame('slots')">
                <div class="game-icon">🎰</div>
                <h3>Slots</h3>
            </div>
            <div class="game-card" onclick="openGame('coinflip')">
                <div class="game-icon">🪙</div>
                <h3>Coinflip</h3>
            </div>
            <div class="game-card" onclick="openGame('dice')">
                <div class="game-icon">🎲</div>
                <h3>Dice</h3>
            </div>
        </div>

        <button class="btn" style="margin-top: auto; background: #242f3d;" onclick="closeApp()">
            ⬅️ Вернуться в Телеграм Бот
        </button>
    </div>

    <!-- MODAL GAMES -->
    <div class="modal" id="game-modal">
        <div class="modal-header">
            <h2 id="modal-title">Игра</h2>
            <button class="close-btn" onclick="closeGame()">Закрыть</button>
        </div>

        <div class="game-area" id="modal-content">
            <!-- Динамический контент игры -->
        </div>

        <div class="controls">
            <input type="number" id="bet-amount" placeholder="Сумма ставки (₽)" value="100" min="10">
            <button class="btn" id="action-btn" onclick="playGame()">Сделать ставку</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Считываем данные пользователя из Telegram
        let userBalance = 1000; // Демо-баланс для Mini App
        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('user-name').innerText = user.first_name || 'Игрок';
            document.getElementById('user-id').innerText = 'ID: ' + user.id;
            document.getElementById('user-avatar').innerText = (user.first_name || 'U')[0].toUpperCase();
        }

        function updateBalanceDisplay() {
            document.getElementById('balance').innerText = userBalance;
        }
        updateBalanceDisplay();

        let currentGame = '';

        function openGame(game) {
            currentGame = game;
            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            const actionBtn = document.getElementById('action-btn');

            modal.classList.add('active');
            actionBtn.style.display = 'block';

            if (game === 'mines') {
                title.innerText = '💣 Mines';
                renderMines(content);
            } else if (game === 'slots') {
                title.innerText = '🎰 Slots';
                content.innerHTML = `<div class="slots-display" id="slots">🎰 | 🎰 | 🎰</div>`;
            } else if (game === 'coinflip') {
                title.innerText = '🪙 Coinflip';
                content.innerHTML = `<div class="coin" id="coin">?</div>`;
            } else if (game === 'dice') {
                title.innerText = '🎲 Dice';
                content.innerHTML = `<div style="font-size: 60px;" id="dice-val">🎲</div>`;
            }
        }

        function closeGame() {
            document.getElementById('game-modal').classList.remove('active');
        }

        function closeApp() {
            tg.close();
        }

        function getBet() {
            const bet = parseInt(document.getElementById('bet-amount').value);
            if (isNaN(bet) || bet <= 0) {
                alert('Введите корректную сумму ставки!');
                return null;
            }
            if (bet > userBalance) {
                alert('Недостаточно средств на балансе!');
                return null;
            }
            return bet;
        }

        function playGame() {
            const bet = getBet();
            if (!bet) return;

            if (currentGame === 'slots') {
                userBalance -= bet;
                const symbols = ['7️⃣', '🍒', '🍋', '🔔', '💎'];
                const s1 = symbols[Math.floor(Math.random() * symbols.length)];
                const s2 = symbols[Math.floor(Math.random() * symbols.length)];
                const s3 = symbols[Math.floor(Math.random() * symbols.length)];

                document.getElementById('slots').innerText = `${s1} | ${s2} | ${s3}`;

                if (s1 === s2 && s2 === s3) {
                    const win = bet * 5;
                    userBalance += win;
                    alert(`🎉 ДЖЕКПОТ! Вы выиграли ${win} ₽!`);
                } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                    const win = Math.floor(bet * 1.5);
                    userBalance += win;
                    alert(`😊 Совпадение! Вы выиграли ${win} ₽!`);
                }
                updateBalanceDisplay();
            } 
            else if (currentGame === 'coinflip') {
                userBalance -= bet;
                const isHeads = Math.random() > 0.5;
                const coinEl = document.getElementById('coin');
                coinEl.innerText = isHeads ? '🦅' : '🪙';

                if (isHeads) {
                    const win = Math.floor(bet * 1.95);
                    userBalance += win;
                    alert(`🎉 Орёл! Вы выиграли ${win} ₽!`);
                } else {
                    alert('❌ Решка! Ставка сгорела.');
                }
                updateBalanceDisplay();
            }
            else if (currentGame === 'dice') {
                userBalance -= bet;
                const roll = Math.floor(Math.random() * 100) + 1;
                document.getElementById('dice-val').innerText = roll;

                if (roll > 50) {
                    const win = Math.floor(bet * 1.95);
                    userBalance += win;
                    alert(`🎉 Выпало ${roll} (>50)! Вы выиграли ${win} ₽!`);
                } else {
                    alert(`❌ Выпало ${roll} (<=50)! Ставка сгорела.`);
                }
                updateBalanceDisplay();
            }
        }

        /* MINES LOGIC */
        function renderMines(container) {
            container.innerHTML = `<div class="mines-board" id="mines-board"></div>`;
            const board = document.getElementById('mines-board');
            for (let i = 0; i < 25; i++) {
                const tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.innerText = '❓';
                tile.onclick = () => openMineTile(tile);
                board.appendChild(tile);
            }
        }

        function openMineTile(tile) {
            if (tile.classList.contains('open')) return;
            const bet = getBet();
            if (!bet) return;

            const isBomb = Math.random() < 0.2; // 20% шанс мины
            if (isBomb) {
                tile.classList.add('bomb');
                tile.innerText = '💣';
                userBalance -= bet;
                alert('💥 БУМ! Вы наткнулись на мину.');
            } else {
                tile.classList.add('open');
                tile.innerText = '💎';
                const win = Math.floor(bet * 1.2);
                userBalance += (win - bet);
            }
            updateBalanceDisplay();
        }
    </script>
</body>
</html>
